<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速静态查询｜增强完整版</title>
    <style>
        :root {
            --bg: #090b12;
            --panel: #141928;
            --card: #1b2235;
            --accent: #39ff9d;
            --accent-dim: #24b870;
            --green: #46ff9f;
            --red: #ff5263;
            --blue: #42a5ff;
            --purple: #b76dff;
            --text: #f7f9ff;
            --muted: #9aa4b8;
            --border: #293248;
            --shadow-glow: 0 0 22px rgba(57, 255, 157, 0.18);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, monospace;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #162238 0, transparent 38%), var(--bg);
            color: var(--text);
            padding: 18px;
        }
        .container {
            max-width: 1240px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 26px;
            flex-wrap: wrap;
            gap: 14px;
        }
        h1 {
            font-size: clamp(1.8rem, 7vw, 2.6rem);
            color: var(--accent);
            text-shadow: 0 0 20px rgba(57, 255, 157, 0.32);
            font-weight: 800;
        }
        .lang-wrap {
            display: flex;
            gap: 8px;
        }
        button.lang {
            padding: 7px 12px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.22s ease;
        }
        button.lang:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px rgba(57, 255, 157, 0.12);
        }
        button.lang.active {
            background: var(--accent);
            color: #081410;
            border-color: var(--accent);
        }
        .main-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 26px;
            box-shadow: var(--shadow-glow);
        }
        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 26px;
            align-items: center;
        }
        #targetInput {
            flex: 1;
            min-width: 220px;
            padding: 13px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #0f131f;
            color: var(--text);
            font-size: 1rem;
        }
        #typeSelect {
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #0f131f;
            color: var(--text);
            min-width: 170px;
        }
        #fetchBtn {
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #081410;
            font-weight: 800;
            cursor: pointer;
            transition: 0.22s;
        }
        #fetchBtn:hover {
            filter: brightness(1.22);
            transform: translateY(-1px);
            box-shadow: 0 0 14px rgba(57, 255, 157, 0.35);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }
        .item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
        }
        .item h3 {
            color: var(--accent);
            margin-bottom: 9px;
            font-size: 1.05rem;
        }
        .item p,
        .item pre {
            color: var(--muted);
            white-space: pre-wrap;
            font-family: monospace;
            line-height: 1.45;
        }
        .online {
            color: var(--green);
            font-weight: bold;
        }
        .offline {
            color: var(--red);
            font-weight: bold;
        }
        .info-blue {
            color: var(--blue);
            font-weight: bold;
        }
        .info-purple {
            color: var(--purple);
            font-weight: bold;
        }
        .empty {
            text-align: center;
            padding: 36px;
            color: var(--muted);
            font-size: 1.05rem;
        }
        .loading {
            text-align: center;
            padding: 36px;
            color: var(--accent);
            animation: pulse 1.1s infinite;
            font-size: 1.15rem;
        }
        .history-title {
            margin-top: 24px;
            color: var(--accent);
            font-size: 1.08rem;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.42;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 data-i18n="title">极速静态查询</h1>
            <div class="lang-wrap">
                <button class="lang" data-lang="en">EN</button>
                <button class="lang active" data-lang="zh">中文</button>
                <button class="lang" data-lang="ja">日本語</button>
            </div>
        </header>
        <section class="main-card">
            <div class="input-row">
                <input id="targetInput" placeholder="输入域名 / IP / 服务器地址（可带端口）">
                <select id="typeSelect">
                    <option value="website">网站 / 域名</option>
                    <option value="mcjava">Minecraft Java</option>
                    <option value="mcbedrock">Minecraft 基岩版</option>
                </select>
                <button id="fetchBtn" data-i18n="btn">极速查询</button>
            </div>
            <div id="resultBox"></div>
            <div id="historyBox"></div>
        </section>
    </div>

    <script>
        const translations = {
            en: {
                title: "Ultra‑Fast Static Checker",
                btn: "Fast Query",
                tip: "Enter target and click fast query, multi‑source aggregated.",
                loading: "🔄 Loading, fetching all available data…",
                status: "Status",
                online: "Online",
                offline: "Offline",
                target: "Target Address",
                resolvedIp: "Resolved IP",
                port: "Port",
                source: "Data Source",
                version: "Version",
                protocol: "Protocol Ver.",
                ping: "Ping / Latency",
                players: "Players (Online / Max)",
                samplePlayers: "Sample Players",
                motdClean: "MOTD (Clean)",
                motdRaw: "Raw MOTD",
                icon: "Server Icon",
                software: "Server Software",
                mods: "Mods",
                plugins: "Plugins",
                gamemode: "Game Mode",
                mapName: "Map / World Name",
                serverId: "Server ID",
                httpCode: "HTTP Status",
                favicon: "Favicon",
                pageMeta: "Page Meta / OG",
                securityHeaders: "Security Headers",
                checkTime: "Check Time",
                history: "Query History",
                fail: "❌ All sources timed out / failed, retry or change target."
            },
            zh: {
                title: "极速静态查询",
                btn: "极速查询",
                tip: "填入目标，点极速查询，多源聚合，拉取全部可用信息。",
                loading: "🔄 加载中，正在拉取全部可用信息……",
                status: "状态",
                online: "在线",
                offline: "离线",
                target: "目标地址",
                resolvedIp: "解析真实 IP",
                port: "端口",
                source: "数据源",
                version: "版本",
                protocol: "协议版本",
                ping: "延迟 (Ping)",
                players: "在线玩家 / 最大玩家",
                samplePlayers: "样例在线玩家",
                motdClean: "服务器简介（净化）",
                motdRaw: "原始 MOTD（带颜色）",
                icon: "服务器图标",
                software: "服务端核心",
                mods: "已加载模组",
                plugins: "已加载插件",
                gamemode: "游戏模式",
                mapName: "世界 / 地图名",
                serverId: "服务器 ID",
                httpCode: "HTTP 状态码",
                favicon: "网站图标",
                pageMeta: "页面元信息 / OG",
                securityHeaders: "安全响应头",
                checkTime: "探测耗时",
                history: "查询历史记录",
                fail: "❌ 所有源超时/失败，请重试或更换目标。"
            },
            ja: {
                title: "超高速静的検索",
                btn: "高速検索",
                tip: "対象を入力、高速検索。複数ソースから情報を集めます。",
                loading: "🔄 読み込み中、すべてのデータを取得しています…",
                status: "ステータス",
                online: "オンライン",
                offline: "オフライン",
                target: "対象アドレス",
                resolvedIp: "解決された IP",
                port: "ポート",
                source: "データソース",
                version: "バージョン",
                protocol: "プロトコルバージョン",
                ping: "遅延 (Ping)",
                players: "プレイヤー数（現在 / 最大）",
                samplePlayers: "サンプルプレイヤー",
                motdClean: "MOTD（クリーン）",
                motdRaw: "生の MOTD",
                icon: "サーバーアイコン",
                software: "サーバーソフト",
                mods: "Mod",
                plugins: "プラグイン",
                gamemode: "ゲームモード",
                mapName: "ワールド名",
                serverId: "サーバー ID",
                httpCode: "HTTP コード",
                favicon: "ファビコン",
                pageMeta: "ページメタ情報",
                securityHeaders: "セキュリティヘッダー",
                checkTime: "検出時間",
                history: "検索履歴",
                fail: "❌ すべてのソースがタイムアウトまたは失敗しました。再試行または対象を変更してください。"
            }
        };
        let currentLang = "zh";
        const USE_PROXY = false;
        const PROXY_PREFIX = "https://your-proxy.example.com/?url=";

        const DB_NAME = "serverCheckerEnhancedV1";
        const STORE = "cacheV1";
        const HIST_STORE = "historyV1";
        let db;

        async function openDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE)) {
                        d.createObjectStore(STORE, { keyPath: "key" });
                    }
                    if (!d.objectStoreNames.contains(HIST_STORE)) {
                        const hist = d.createObjectStore(HIST_STORE, {
                            keyPath: "id",
                            autoIncrement: true
                        });
                        hist.createIndex("time", "ts");
                    }
                };
                req.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                req.onerror = () => resolve(null);
            });
        }

        async function getCache(key) {
            if (!db) return null;
            const tx = db.transaction(STORE, "readonly");
            const st = tx.objectStore(STORE);
            return new Promise((res) => {
                const r = st.get(key);
                r.onsuccess = () => {
                    const v = r.result;
                    if (!v) return res(null);
                    const now = Date.now();
                    if (now - v.ts > 70000) return res(null);
                    res(v.data);
                };
                r.onerror = () => res(null);
            });
        }

        async function setCache(key, data) {
            if (!db) return;
            const tx = db.transaction(STORE, "readwrite");
            const st = tx.objectStore(STORE);
            st.put({ key, ts: Date.now(), data });
        }

        async function saveHistory(target, type, result) {
            if (!db) return;
            const tx = db.transaction(HIST_STORE, "readwrite");
            const st = tx.objectStore(HIST_STORE);
            st.put({
                target,
                type,
                result,
                ts: Date.now()
            });
        }

        function buildFetchUrl(rawUrl) {
            if (USE_PROXY) return PROXY_PREFIX + encodeURIComponent(rawUrl);
            return rawUrl;
        }

        function withTimeout(promise, ms) {
            const timeout = new Promise((_, rej) =>
                setTimeout(() => rej(new Error("timeout")), ms)
            );
            return Promise.race([promise, timeout]);
        }

        async function safeFetch(url, opts = {}) {
            const start = performance.now();
            const res = await fetch(buildFetchUrl(url), {
                ...opts,
                signal: AbortSignal.timeout(2400)
            });
            const elapsed = performance.now() - start;
            return { res, elapsed };
        }

        async function sourceMcsrvstat(host) {
            const enc = encodeURIComponent(host.trim());
            const target = `https://api.mcsrvstat.us/3/${enc}`;
            const { res, elapsed } = await safeFetch(target, {
                mode: "no-cors"
            });
            if (res.type === "opaque") {
                return {
                    sourceName: "mcsrvstat.us",
                    online: true,
                    canReadJson: false,
                    pingMs: Math.round(elapsed),
                    version: "（跨域，无法读取详情）",
                    protocol: "—",
                    playersRaw: "—",
                    samplePlayers: "—",
                    motdClean: "—",
                    motdRaw: "—",
                    icon: "",
                    software: "—",
                    mods: "—",
                    plugins: "—",
                    gamemode: "—",
                    mapName: "—",
                    serverId: "—",
                    resolvedIp: "—",
                    port: "—"
                };
            }
            if (!res.ok) throw new Error("bad http status");
            const j = await res.json();
            return {
                sourceName: "mcsrvstat.us",
                online: j.online ?? false,
                canReadJson: true,
                pingMs: Math.round(elapsed),
                version: j.version?.name || "无",
                protocol: j.version?.protocol ?? "—",
                playersRaw: j.players
                    ? `${j.players.online ?? 0}/${j.players.max ?? 0}`
                    : "无",
                samplePlayers: j.players?.sample
                    ? j.players.sample.map((p) => p.name).join(", ")
                    : "无",
                motdClean: j.motd?.clean?.join("\n") || "无",
                motdRaw: j.motd?.raw || "无",
                icon: j.icon || "",
                software: j.software || "无",
                mods: j.mods ? JSON.stringify(j.mods, null, 2) : "无",
                plugins: j.plugins?.join("\n") || "无",
                gamemode: "—",
                mapName: "—",
                serverId: "—",
                resolvedIp: j.ip || "—",
                port: j.port ?? "—"
            };
        }

        async function sourceMcPing(host, edition) {
            const ed = edition === "mcbedrock" ? "bedrock" : "java";
            const target = `https://api.mcping.me/api/${ed}/${encodeURIComponent(host.trim())}`;
            const { res, elapsed } = await safeFetch(target, {
                mode: "no-cors"
            });
            if (res.type === "opaque") {
                return {
                    sourceName: "mcping.me",
                    online: true,
                    canReadJson: false,
                    pingMs: Math.round(elapsed),
                    version: "（跨域，无法读取详情）",
                    protocol: "—",
                    playersRaw: "—",
                    samplePlayers: "—",
                    motdClean: "—",
                    motdRaw: "—",
                    icon: "",
                    software: "—",
                    mods: "—",
                    plugins: "—",
                    gamemode: "—",
                    mapName: "—",
                    serverId: "—",
                    resolvedIp: "—",
                    port: "—"
                };
            }
            if (!res.ok) throw new Error("bad http status");
            const j = await res.json();
            return {
                sourceName: "mcping.me",
                online: j.online ?? false,
                canReadJson: true,
                pingMs: j.latency ?? Math.round(elapsed),
                version: j.version?.name || "无",
                protocol: j.version?.protocol ?? "—",
                playersRaw: j.players
                    ? `${j.players.online ?? 0}/${j.players.max ?? 0}`
                    : "无",
                samplePlayers: j.players?.sample
                    ? j.players.sample.map((p) => p.name).join(", ")
                    : "无",
                motdClean: j.motd?.clean || "无",
                motdRaw: j.motd?.raw || "无",
                icon: j.icon || "",
                software: "无",
                mods: "无",
                plugins: "无",
                gamemode: "—",
                mapName: "—",
                serverId: "—",
                resolvedIp: "—",
                port: "—"
            };
        }

        async function sourceWebsite(targetRaw) {
            let urlRaw;
            if (targetRaw.startsWith("http://") || targetRaw.startsWith("https://")) {
                urlRaw = targetRaw;
            } else {
                urlRaw = `https://${targetRaw}`;
            }
            const { res, elapsed } = await safeFetch(urlRaw, {
                method: "HEAD",
                mode: "no-cors"
            });
            if (res.type === "opaque") {
                return {
                    sourceName: "Web HEAD",
                    online: true,
                    canReadJson: false,
                    pingMs: Math.round(elapsed),
                    httpCode: "（跨域不可读）",
                    favicon: "—",
                    pageMeta: "跨域限制，无法读取元数据",
                    securityHeaders: "跨域限制，拿不到原始头",
                    resolvedIp: "浏览器解析",
                    port: "—"
                };
            }
            const headersObj = Object.fromEntries(res.headers);
            return {
                sourceName: "Web HEAD",
                online: res.ok,
                canReadJson: true,
                pingMs: Math.round(elapsed),
                httpCode: res.status,
                favicon: "需要额外元 API 获取",
                pageMeta: "HEAD 请求无法抓取页面正文",
                securityHeaders: JSON.stringify(headersObj, null, 2),
                resolvedIp: "浏览器解析",
                port: "—"
            };
        }

        async function aggregateQuery(target, type) {
            const cacheKey = `${type}:${target}`;
            const cached = await getCache(cacheKey);
            if (cached) return cached;

            let taskList = [];
            if (type === "mcjava" || type === "mcbedrock") {
                taskList = [
                    withTimeout(sourceMcsrvstat(target), 2300),
                    withTimeout(sourceMcPing(target, type), 2300)
                ];
            } else if (type === "website") {
                taskList = [
                    withTimeout(sourceWebsite(target), 2000)
                ];
            }

            const resultsRaw = await Promise.allSettled(taskList);
            const valid = [];
            for (const r of resultsRaw) {
                if (r.status === "fulfilled") valid.push(r.value);
            }
            if (!valid.length) throw new Error("all failed");
            const primary = valid[0];
            primary.queryTarget = target;
            primary.allSources = valid;
            await setCache(cacheKey, primary);
            await saveHistory(target, type, primary);
            return primary;
        }

        function applyLang(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.querySelectorAll("[data-i18n]").forEach((el) => {
                const k = el.dataset.i18n;
                el.innerText = t[k];
            });
            document.querySelectorAll(".lang").forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.lang === lang);
            });
        }

        function renderLoading() {
            const box = document.getElementById("resultBox");
            const t = translations[currentLang];
            box.innerHTML = `<div class="loading">${t.loading}</div>`;
        }

        function renderFail() {
            const box = document.getElementById("resultBox");
            const t = translations[currentLang];
            box.innerHTML = `<div class="empty">${t.fail}</div>`;
        }

        function renderResult(data) {
            const box = document.getElementById("resultBox");
            const t = translations[currentLang];
            const statClass = data.online ? "online" : "offline";
            const statTxt = data.online ? t.online : t.offline;

            let html = `<div class="grid">
                <div class="item">
                    <h3>${t.status}</h3>
                    <p class="${statClass}">${statTxt}</p>
                </div>
                <div class="item">
                    <h3>${t.target}</h3>
                    <p>${data.queryTarget ?? ""}</p>
                </div>
                <div class="item">
                    <h3>${t.source}</h3>
                    <p>${data.sourceName ?? ""}</p>
                </div>
                <div class="item">
                    <h3>${t.ping}</h3>
                    <p class="info-blue">${data.pingMs ?? "—"} ms</p>
                </div>
                <div class="item">
                    <h3>${t.resolvedIp}</h3>
                    <p>${data.resolvedIp ?? "—"}</p>
                </div>
                <div class="item">
                    <h3>${t.port}</h3>
                    <p>${data.port ?? "—"}</p>
                </div>
            `;

            if (data.sourceName === "Web HEAD") {
                html += `
                    <div class="item">
                        <h3>${t.httpCode}</h3>
                        <p>${data.httpCode ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.favicon}</h3>
                        <p>${data.favicon ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.pageMeta}</h3>
                        <p>${data.pageMeta ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.securityHeaders}</h3>
                        <pre>${data.securityHeaders ?? "—"}</pre>
                    </div>
                `;
            } else {
                html += `
                    <div class="item">
                        <h3>${t.version}</h3>
                        <p>${data.version ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.protocol}</h3>
                        <p class="info-purple">${data.protocol ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.players}</h3>
                        <p>${data.playersRaw ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.samplePlayers}</h3>
                        <p>${data.samplePlayers ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.motdClean}</h3>
                        <p>${data.motdClean ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.motdRaw}</h3>
                        <pre>${data.motdRaw ?? "—"}</pre>
                    </div>
                    <div class="item">
                        <h3>${t.software}</h3>
                        <p>${data.software ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.plugins}</h3>
                        <pre>${data.plugins ?? "—"}</pre>
                    </div>
                    <div class="item">
                        <h3>${t.mods}</h3>
                        <pre>${data.mods ?? "—"}</pre>
                    </div>
                    <div class="item">
                        <h3>${t.gamemode}</h3>
                        <p>${data.gamemode ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.mapName}</h3>
                        <p>${data.mapName ?? "—"}</p>
                    </div>
                    <div class="item">
                        <h3>${t.serverId}</h3>
                        <p>${data.serverId ?? "—"}</p>
                    </div>
                `;
                if (data.icon && data.icon !== "") {
                    html += `
                        <div class="item">
                            <h3>${t.icon}</h3>
                            <p><img src="${data.icon}" style="max-width:130px;border-radius:10px;"></p>
                        </div>
                    `;
                }
            }
            html += `</div>`;
            box.innerHTML = html;
        }

        async function onQueryClick() {
            const target = document.getElementById("targetInput").value.trim();
            const type = document.getElementById("typeSelect").value;
            if (!target) return;
            renderLoading();
            try {
                const res = await aggregateQuery(target, type);
                renderResult(res);
            } catch (err) {
                renderFail();
            }
        }

        (async () => {
            await openDB();
            applyLang(currentLang);
            document.querySelectorAll(".lang").forEach((btn) => {
                btn.onclick = () => applyLang(btn.dataset.lang);
            });
            document.getElementById("fetchBtn").onclick = onQueryClick;
        })();
    </script>
</body>
</html>
